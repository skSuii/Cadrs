[package]
name = "Cadrs"
version = "0.1.2"
edition = "2021"
description = "Cadsdk for rust"
authors = ["Cadrs"]
license = "Apache-2.0"
repository = "https://github.com/Sh1Art/Cadrs"

[lib]
name = "cadrs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["geometry", "math", "data_structure", "io", "render"]
geometry = []
math = []
data_structure = []
io = []
render = []
api = []
performance = []
boolean = []
constraint = []
gpu = ["wgpu"]
nurbs = []
polyline = []
ellipse = []

[dependencies]
num-traits = "0.2"
num-derive = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
rand = "0.8"
parking_lot = "0.12"
rayon = "1.5"
ahash = "0.7"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
getrandom = { version = "0.2", features = ["js"] }

[dependencies.rstar]
version = "0.12"

[dependencies.clipper2]
version = "0.5"

[dependencies.wgpu]
version = "23"
optional = true
features = ["spirv"]

[dependencies.nalgebra]
version = "0.33"

[dependencies.bytemuck]
version = "1.0"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "bmp", "webp"]

[dependencies.lopdf]
version = "0.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console", "ImageData", "HtmlCanvasElement", "CanvasRenderingContext2d"] }

[dev-dependencies]
criterion = "0.5"
